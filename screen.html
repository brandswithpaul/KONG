<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand · GETKONG RUN</title>
<meta name="robots" content="noindex">
<style>
  @font-face{font-family:'Switzer';src:url('assets/Switzer-Variable.woff2') format('woff2-variations'),
    url('assets/Switzer-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/Switzer-VariableItalic.woff2') format('woff2-variations'),
    url('assets/Switzer-VariableItalic.woff2') format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
  @font-face{font-family:'Inter';src:url('assets/Inter-Variable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;font-display:swap}
  :root{--dark:#162114;--lime:#c2e67e;--paper:#fdf8ea;
    --font:'Switzer',system-ui,sans-serif;--klein:'Inter',system-ui,sans-serif;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:var(--dark) url('assets/menu-strasse.jpg') center 45%/cover no-repeat;
    font-family:var(--klein);color:var(--paper);overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(10,26,22,.78),rgba(8,20,17,.93))}
  .raster{position:relative;height:100vh;display:grid;grid-template-columns:1.25fr .75fr;
    gap:clamp(18px,2.4vw,40px);padding:clamp(18px,2.6vh,34px) clamp(20px,2.6vw,44px)}
  .kopf{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .kopf img{width:clamp(150px,15vw,250px)}
  .kopf .titel{font-family:var(--font);font-weight:900;font-style:italic;text-transform:uppercase;
    font-size:clamp(20px,2.8vw,42px);letter-spacing:.2em;-webkit-text-stroke:3px #16281f;paint-order:stroke fill;
    text-shadow:0 0 26px rgba(194,230,126,.5)}
  .kasten{background:rgba(14,30,25,.88);border:3px solid var(--lime);border-radius:24px;
    padding:clamp(16px,2vh,26px) clamp(18px,1.8vw,30px);min-height:0;
    box-shadow:0 0 0 3px rgba(12,26,21,.7),0 0 42px rgba(194,230,126,.34)}
  .tafel{display:flex;flex-direction:column}
  .label{font-size:clamp(10px,1vw,14px);letter-spacing:.28em;text-transform:uppercase;
    color:var(--lime);opacity:.9;margin-bottom:clamp(8px,1.4vh,16px)}
  .liste{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;overflow:hidden}
  .zeile{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,18px);
    font-size:clamp(15px,2.1vw,32px);font-variant-numeric:tabular-nums}
  .zeile .rk{width:2.4em;flex:none;color:var(--lime);font-weight:700;opacity:.85}
  .zeile .nm{font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
  .zeile .fill{flex:1;border-bottom:2px dotted rgba(253,248,234,.22);transform:translateY(-.35em)}
  .zeile .sc{flex:none;font-weight:700}
  .zeile:first-child{color:var(--lime);text-shadow:0 0 22px rgba(194,230,126,.5)}
  .zeile:first-child .nm{font-size:1.12em}
  .zeile.leer{opacity:.35}
  .spalte{display:flex;flex-direction:column;gap:clamp(14px,1.8vh,24px);min-height:0}
  .qrKasten{text-align:center}
  .qrKasten svg{width:min(100%,300px);height:auto;background:#fdf8ea;border-radius:16px;padding:12px}
  .qrText{margin-top:12px;font-size:clamp(12px,1.2vw,18px);line-height:1.55;opacity:.9}
  .qrText b{color:var(--lime)}
  .schritte{font-size:clamp(11px,1.05vw,15px);line-height:1.9;opacity:.85;text-align:left}
  .schritte span{display:inline-flex;align-items:center;justify-content:center;
    width:1.7em;height:1.7em;margin-right:.6em;border-radius:99px;
    background:var(--lime);color:#16281f;font-weight:700;font-size:.85em}
  .fuss{position:absolute;left:0;right:0;bottom:6px;text-align:center;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.35}
  .rechtlich{position:absolute;right:14px;bottom:6px;font-size:9px;letter-spacing:.1em;opacity:.3}
  .rechtlich a{color:var(--paper);text-decoration:none}
  @media (max-width:900px){.raster{grid-template-columns:1fr;overflow-y:auto;height:auto}}
</style>
</head>
<body>
<div class="raster">
  <div class="kopf">
    <img src="assets/getkong-logo-lime.svg" alt="GETKONG">
    <div class="titel" id="titel">Tagesbeste</div>
  </div>

  <div class="kasten tafel">
    <div class="label" id="listenLabel">Beste Kuriere heute</div>
    <div class="liste" id="liste"></div>
  </div>

  <div class="spalte">
    <div class="kasten qrKasten">
      <div class="label">Mitspielen</div>
      <div id="qrZiel"></div>
      <div class="qrText">Scannen und anmelden</div>
    </div>
    <div class="kasten">
      <div class="label">So geht's</div>
      <div class="schritte">
        <div><span>1</span>QR scannen, anmelden</div>
        <div><span>2</span>Code aufs Handy bekommen</div>
        <div><span>3</span>Code am Gerät eingeben</div>
        <div><span>4</span>Fahren, liefern, oben landen</div>
      </div>
    </div>
  </div>
  <div class="fuss" id="fuss"></div>
  <div class="rechtlich">
    <a href="https://www.getkong.de/impressum" target="_blank" rel="noopener">Impressum</a> ·
    <a href="https://www.getkong.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
  </div>
</div>

<script>
const SB_URL = 'https://iejuuattiqyymcbprxmu.supabase.co';
const SB_KEY = 'sb_publishable_CGkLV2Y_A9cctjrhBckeEA_xRNfdWRU';
const SEASON_START = '2026-08-15T12:30:00Z';
const PLAETZE = 10;
let VERSTECKT = true;   // wird abgeschaltet, falls die Spalte fehlt

const el = id => document.getElementById(id);

fetch('assets/qr-anmeldung.svg').then(r => r.text()).then(svg => { el('qrZiel').innerHTML = svg; })
  .catch(() => { el('qrZiel').textContent = 'getkong.world'; });

function heuteAb(){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

// Ein Name, ein Platz — sonst belegt ein einzelner Spieler die halbe Tafel.
function bestenProName(zeilen){
  const beste = new Map();
  for(const z of (zeilen || [])){
    const k = (z.name || '—').trim().toUpperCase();
    const alt = beste.get(k);
    if(!alt || Number(z.dist || 0) > Number(alt.dist || 0)) beste.set(k, z);
  }
  return Array.from(beste.values()).sort((a, b) => Number(b.dist || 0) - Number(a.dist || 0));
}

function zeichnen(liste){
  const box = el('liste');
  let html = '';
  for(let i = 0; i < PLAETZE; i++){
    const e = liste[i];
    html += '<div class="zeile' + (e ? '' : ' leer') + '">' +
      '<span class="rk">' + (i === 0 ? '🏆' : (i + 1) + '.') + '</span>' +
      '<span class="nm">' + (e ? String(e.name || '—').replace(/</g, '&lt;') : '— — —') + '</span>' +
      '<span class="fill"></span>' +
      '<span class="sc">' + (e ? Number(e.dist || 0).toLocaleString('de-DE') + ' m' : '0 m') + '</span></div>';
  }
  box.innerHTML = html;
}

// Wechselt alle 20 Sekunden zwischen heute und der ganzen Messe — am Monitor
// will man beides sehen, ohne dass jemand klickt.
let alleZeiten = false;
function laden(){
  const ab = alleZeiten ? SEASON_START : heuteAb();
  el('titel').textContent = alleZeiten ? 'Bestenliste' : 'Tagesbeste';
  el('listenLabel').textContent = alleZeiten ? 'Beste Kuriere der Messe' : 'Beste Kuriere heute';
  // Der Filter auf `versteckt` fliegt raus, sobald die Spalte fehlt — sonst
  // bliebe der Monitor am Stand leer, nur weil ein SQL noch nicht gelaufen ist.
  const basis = SB_URL + '/rest/v1/getkong_scores?select=name,dist&created_at=gte.' +
        encodeURIComponent(ab) + '&order=dist.desc&limit=200';
  fetch(basis + (VERSTECKT ? '&versteckt=is.false' : ''), { headers: { apikey: SB_KEY } })
    .then(r => { if(r.ok) return r.json();
      if(VERSTECKT){ VERSTECKT = false;
        return fetch(basis, { headers: { apikey: SB_KEY } }).then(r2 => r2.ok ? r2.json() : Promise.reject(r2.status)); }
      return Promise.reject(r.status); })
    .then(rohe => {
      zeichnen(bestenProName(rohe));
      el('fuss').textContent = 'Aktualisiert ' + new Date().toLocaleTimeString('de-DE',
        { hour: '2-digit', minute: '2-digit' });
    })
    .catch(() => { el('fuss').textContent = 'Keine Verbindung zur Bestenliste'; });
}

laden();
setInterval(laden, 10000);
setInterval(() => { alleZeiten = !alleZeiten; laden(); }, 20000);
</script>
</body>
</html>
