<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anmelden · GETKONG RUN</title>
<meta name="robots" content="noindex">
<style>
  @font-face{
    font-family:'Switzer';
    src:url('assets/Switzer-Variable.woff2') format('woff2-variations'),
        url('assets/Switzer-Variable.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Switzer';
    src:url('assets/Switzer-VariableItalic.woff2') format('woff2-variations'),
        url('assets/Switzer-VariableItalic.woff2') format('woff2');
    font-weight:100 900; font-style:italic; font-display:swap;
  }
  @font-face{
    font-family:'Inter';
    src:url('assets/Inter-Variable.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  :root{
    --dark:#162114; --lime:#c2e67e; --paper:#fdf8ea;
    --font:'Switzer',system-ui,-apple-system,sans-serif;
    --klein:'Inter',system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;background:var(--dark) url('assets/menu-strasse.jpg') center 42%/cover no-repeat;
    font-family:var(--klein);color:var(--paper);display:flex;align-items:center;justify-content:center;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  body::before{content:'';position:fixed;inset:0;
    background:linear-gradient(rgba(10,26,22,.72),rgba(8,20,17,.9))}
  .karte{position:relative;width:min(420px,100%);
    background:rgba(14,30,25,.9);border:3px solid var(--lime);border-radius:24px;
    padding:26px 22px 20px;backdrop-filter:blur(5px);
    box-shadow:0 0 0 3px rgba(12,26,21,.75),0 0 44px rgba(194,230,126,.4)}
  .logo{display:block;width:min(220px,62%);margin:0 auto 4px}
  h1{font-family:var(--font);font-weight:900;font-style:italic;text-transform:uppercase;
    font-size:clamp(22px,7vw,32px);letter-spacing:.16em;text-align:center;line-height:1;
    -webkit-text-stroke:3px #16281f;paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(10,24,18,.6),0 0 22px rgba(194,230,126,.5)}
  .unter{text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--lime);opacity:.85;margin:10px 0 20px}
  form{display:flex;flex-direction:column;gap:11px}
  input{width:100%;background:rgba(12,26,20,.45);border:3px solid var(--lime);
    border-radius:16px;color:var(--paper);font-family:var(--klein);font-size:17px;
    padding:.82em .9em;text-align:center}
  input#username{font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  input::placeholder{color:rgba(253,248,234,.42);text-transform:none;letter-spacing:.04em;font-weight:400}
  input:focus{outline:none;background:rgba(194,230,126,.12);box-shadow:0 0 0 4px rgba(194,230,126,.3)}
  input.err{border-color:#e2705c;animation:ruckel .3s}
  @keyframes ruckel{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .haken{display:flex;gap:10px;align-items:flex-start;cursor:pointer;
    font-size:11.5px;line-height:1.45;opacity:.85;text-align:left;padding:2px 2px 0}
  .haken input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;
    border:2px solid var(--lime);border-radius:6px;background:rgba(12,26,20,.4);
    position:relative;cursor:pointer;margin-top:1px}
  .haken input:checked{background:var(--lime)}
  .haken input:checked::after{content:'';position:absolute;left:6px;top:1px;width:6px;height:12px;
    border:solid #16281f;border-width:0 3px 3px 0;transform:rotate(42deg)}
  .haken.err input{border-color:#e2705c;animation:ruckel .3s}
  .haken a{color:var(--lime)}
  button{width:100%;background:var(--lime);color:#16281f;border:3px solid #16281f;border-radius:16px;
    font-family:var(--klein);font-weight:700;font-size:17px;letter-spacing:.2em;text-transform:uppercase;
    padding:.85em 1em;margin-top:4px;cursor:pointer}
  button:disabled{opacity:.55;cursor:progress}
  .meldung{margin-top:12px;font-size:12px;text-align:center;color:#ffd0a0;min-height:1.2em}
  #fertig{display:none;text-align:center}
  #fertig.an{display:block}
  form.weg{display:none}
  .codeLabel{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--lime);opacity:.85}
  .code{font-family:var(--font);font-weight:900;font-style:italic;
    font-size:clamp(56px,20vw,86px);line-height:1.05;letter-spacing:.08em;
    -webkit-text-stroke:3px #16281f;paint-order:stroke fill;
    text-shadow:0 0 30px rgba(194,230,126,.55);margin:4px 0 2px}
  .codeHinweis{font-size:13px;line-height:1.5;opacity:.9;margin-top:8px}
  .mailhinweis{margin-top:16px;padding:12px 14px;border:2px dashed rgba(194,230,126,.4);
    border-radius:14px;font-size:12px;line-height:1.5;opacity:.85}
  /* Rechtliches: gehört sichtbar auf jede Seite, die Daten entgegennimmt */
  .fuss{margin-top:16px;padding-top:12px;border-top:1px solid rgba(194,230,126,.2);
    font-size:10px;line-height:1.6;opacity:.55;text-align:center}
  .fuss a{color:var(--paper);text-decoration:underline;text-underline-offset:2px}
  .fuss a:hover{color:var(--lime)}
</style>
</head>
<body>
<div class="karte">
  <img class="logo" src="assets/getkong-logo-lime.svg" alt="GETKONG">
  <h1>Runner</h1>
  <div class="unter">Anmeldung · Cannafair</div>

  <form id="form" novalidate>
    <input id="username" maxlength="14" placeholder="Username" autocomplete="off" spellcheck="false" required>
    <input id="email" type="email" maxlength="120" placeholder="E-Mail-Adresse"
           autocomplete="email" inputmode="email" spellcheck="false" required>
    <label class="haken" id="hakenZeile">
      <input type="checkbox" id="consent" checked>
      <span>Ich bin einverstanden, dass GETKONG mir E-Mails zu Produkten und Aktionen schickt.
            Ich kann das jederzeit widerrufen. Es gilt die
            <a href="https://www.getkong.de/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a>.</span>
    </label>
    <button type="submit" id="senden">Code holen</button>
    <div class="meldung" id="meldung"></div>
  </form>

  <div id="fertig">
    <div class="codeLabel">Dein Spielcode</div>
    <div class="code" id="codeAus">0000</div>
    <div class="codeHinweis">Gib den Code am Spielgerät ein — dann kann es losgehen.</div>
    <div class="mailhinweis" id="mailhinweis">
      Wir haben dir den Code auch per E-Mail geschickt.
    </div>
  </div>

  <div class="fuss">
    <a href="https://www.getkong.de/impressum" target="_blank" rel="noopener">Impressum</a> ·
    <a href="https://www.getkong.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a> ·
    <a href="https://www.getkong.de/agb" target="_blank" rel="noopener">AGB</a><br>
    Fast Green Delivery UG (haftungsbeschränkt) · Friedrichstraße 155 · 10117 Berlin
  </div>
</div>

<script src="namensfilter.js"></script>
<script>
// Die Edge Function macht alles: prüfen, Code vergeben, Mail schicken.
// Hier liegt nur der öffentliche Schlüssel — der darf das.
const SB_URL = 'https://iejuuattiqyymcbprxmu.supabase.co';
const SB_KEY = 'sb_publishable_CGkLV2Y_A9cctjrhBckeEA_xRNfdWRU';

const el = id => document.getElementById(id);

function ruckel(feld){
  feld.classList.remove('err'); void feld.offsetWidth; feld.classList.add('err');
}

el('form').addEventListener('submit', async function(e){
  e.preventDefault();
  const username = el('username').value.trim();
  const email    = el('email').value.trim();
  const consent  = el('consent').checked;
  const meldung  = el('meldung');
  meldung.textContent = '';

  // Der Name landet auf einem Monitor am Stand — vorher durch den Filter.
  const gepruft = Namensfilter.pruefeName(username);
  if(!gepruft.ok){
    ruckel(el('username')); el('username').focus();
    meldung.textContent = gepruft.grund;
    return;
  }
  if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)){ ruckel(el('email')); el('email').focus(); return; }
  if(!consent){
    ruckel(el('hakenZeile'));
    meldung.textContent = 'Ohne Einverständnis geht es leider nicht.';
    return;
  }

  el('senden').disabled = true;
  el('senden').textContent = 'Moment…';

  try{
    const r = await fetch(SB_URL + '/functions/v1/anmelden', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: SB_KEY, authorization: 'Bearer ' + SB_KEY },
      body: JSON.stringify({ username, email, consent: true })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.fehler || ('HTTP ' + r.status));

    el('codeAus').textContent = d.code;
    el('form').classList.add('weg');
    el('fertig').classList.add('an');
    try{ localStorage.setItem('gk_code', d.code); localStorage.setItem('getkong-name', username); }catch(err){}
    if(d.mail && d.mail !== 'gesendet'){
      el('mailhinweis').textContent = 'Die E-Mail konnte gerade nicht raus — dein Code gilt trotzdem.';
    }
    if(d.bekannt){
      el('mailhinweis').textContent = 'Diese Adresse kennen wir schon — das ist dein bestehender Code.';
    }
  }catch(err){
    // Am Stand darf eine wacklige Verbindung niemanden aufhalten.
    meldung.innerHTML = 'Anmeldung gerade nicht erreichbar (' + err.message + ').<br>' +
      'Du kannst trotzdem spielen: gib am Gerät einfach <b>' + username.toUpperCase() + '</b> ein.';
    try{ localStorage.setItem('getkong-name', username); }catch(e2){}
    el('senden').disabled = false;
    el('senden').textContent = 'Nochmal versuchen';
  }
});
</script>
</body>
</html>
